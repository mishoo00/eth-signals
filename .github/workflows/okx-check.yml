name: OKX Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Check
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          python - <<'EOF'
          import os, hmac, base64, hashlib, requests
          from datetime import datetime, timezone
          B = "https://www.okx.com"
          def clean(v):
              return "".join(c for c in v if 33 <= ord(c) <= 126)
          rawK = os.environ.get("OKX_API_KEY", "")
          rawS = os.environ.get("OKX_API_SECRET", "")
          rawP = os.environ.get("OKX_PASSPHRASE", "")
          K, S, P = clean(rawK), clean(rawS), clean(rawP)
          for n, r, v in (("KEY", rawK, K), ("SECRET", rawS, S), ("PASS", rawP, P)):
              print(n, "raw_len", len(r), "clean_len", len(v), "removed", len(r) - len(v))
          def show(name, r):
              print(name, "HTTP", r.status_code)
              try:
                  j = r.json()
              except Exception:
                  print("  not json:", r.text[:100])
                  return None
              print("  code:", j.get("code"), "msg:", j.get("msg"))
              return j
          def private(path):
              now = datetime.now(timezone.utc)
              ts = now.strftime("%Y-%m-%dT%H:%M:%S.") + f"{now.microsecond // 1000:03d}Z"
              sig = base64.b64encode(hmac.new(S.encode(), (ts + "GET" + path).encode(), hashlib.sha256).digest()).decode()
              h = {"OK-ACCESS-KEY": K, "OK-ACCESS-SIGN": sig, "OK-ACCESS-TIMESTAMP": ts, "OK-ACCESS-PASSPHRASE": P, "x-simulated-trading": "1"}
              return requests.get(B + path, headers=h, timeout=15)
          j = show("A account config", private("/api/v5/account/config"))
          if j and j.get("data"):
              d = j["data"][0]
              print("  acctLv", d.get("acctLv"), "posMode", d.get("posMode"))
          j = show("B demo balance", private("/api/v5/account/balance"))
          if j and j.get("data"):
              for x in j["data"][0].get("details", []):
                  print("  ", x.get("ccy"), x.get("availBal"))
          EOF
