name: ETH Signals
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "manual / auto / test"
        type: choice
        default: "manual"
        options:
          - manual
          - auto
          - test
permissions:
  contents: write
concurrency:
  group: eth-signals
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python bot.py
        env:
          MODE: ${{ github.event.inputs.mode }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          TRADING_MODE: "demo"
          RISK_USD: "2"
          CAPITAL: "100"
          MAX_LEV: "5"
          MAX_DAILY_LOSS: "6"
          MAX_LOSS_STREAK: "3"
      - if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add signals.json
          git diff --staged --quiet || (git commit -m "update signals" && git push)
